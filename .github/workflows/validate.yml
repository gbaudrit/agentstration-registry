name: Registry validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore pinned registry tool
        run: dotnet tool restore
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install validator dependencies
        run: python -m pip install PyYAML==6.0.3
      - name: Validate Bootstrap content
        run: python scripts/validate.py
      - name: Test Bootstrap validation rules
        run: python -m unittest scripts/test_validate.py
      - name: Validate registry for the custom domain
        run: >-
          dotnet tool run agentstration-source-registry --
          registry validate registry/v1/index.yaml
          --publication-root registry/v1
          --base-uri https://registry.agentstration.io/v1/
      - name: Validate registry for the GitHub Pages domain
        run: >-
          dotnet tool run agentstration-source-registry --
          registry validate registry/v1/index.yaml
          --publication-root registry/v1
          --base-uri https://gbaudrit.github.io/agentstration-registry/v1/
      - name: Build registry twice
        run: |
          dotnet tool run agentstration-source-registry -- registry build registry/v1/index.yaml --publication-root registry/v1 --base-uri https://registry.agentstration.io/v1/ --output artifacts/first
          dotnet tool run agentstration-source-registry -- registry build registry/v1/index.yaml --publication-root registry/v1 --base-uri https://registry.agentstration.io/v1/ --output artifacts/second
      - name: Verify publication allowlist and reproducibility
        run: python scripts/verify_publication.py artifacts/first artifacts/second
